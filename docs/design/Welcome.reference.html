<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ServiceEx welcome</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#070B16}
.hv:hover{background:rgba(173,196,255,.08)}
.pri:hover{background:#00AFEF}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #00AFEF;outline-offset:2px}
</style>

<div style="--bg:#070B16;--panel:#0D1324;--line2:rgba(173,196,255,.18);--text:#EEF2FA;--text2:#B4BED4;--muted:#8793AF;--accent:#0087CB;--ink:#031018;width:1440px;height:900px;box-sizing:border-box;display:flex;background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,sans-serif;font-size:14px;line-height:1.4;overflow:hidden">

  <!-- BRAND SIDE -->
  <div style="position:relative;flex:1;min-width:0;overflow:hidden;background:radial-gradient(90% 90% at 0% 100%,#0087CB 0%,#064C75 35%,#0A0F1E 75%)">
    <svg width="100%" height="100%" viewBox="0 0 720 900" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0" aria-hidden="true">
      <g fill="none" stroke="#00AFEF" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-20 820 L140 820 L140 700 L300 700 L300 560 L460 560 L460 420 L620 420 L620 280 L760 280" stroke-width="3" opacity=".95"/>
        <path d="M-20 860 L180 860 L180 740 L340 740 L340 600 L500 600 L500 460 L660 460 L660 320 L760 320" stroke-width="2" opacity=".5"/>
        <path d="M-20 900 L220 900 L220 780 L380 780 L380 640 L540 640 L540 500 L700 500 L700 360 L760 360" stroke-width="1.5" opacity=".28"/>
        <path d="M-20 780 L100 780 L100 660 L260 660 L260 520 L420 520 L420 380 L580 380 L580 240 L760 240" stroke-width="1.5" opacity=".28"/>
      </g>
      <circle cx="620" cy="280" r="9" fill="#EAF7FF"/>
      <circle cx="620" cy="280" r="22" fill="none" stroke="#00AFEF" stroke-width="2" opacity=".5"/>
    </svg>
    <div style="position:absolute;top:36px;left:48px;display:flex;align-items:center;gap:10px">
      <svg width="32" height="32" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#0087CB"/><path d="M8 19l5-5 3 3 5-6" stroke="#031018" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:22px;letter-spacing:-0.02em">ServiceEx</span>
    </div>
    <div style="position:absolute;left:48px;right:48px;top:96px;font-size:13px;font-weight:600;letter-spacing:.14em;color:#BFE6FA">FOR THE PEOPLE BEHIND THE SCREEN</div>
  </div>

  <!-- ACTION SIDE -->
  <div style="width:640px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg)">
    <div style="width:420px;display:flex;flex-direction:column;gap:12px">
      <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:40px;line-height:1.08;font-weight:700;letter-spacing:-0.03em;text-wrap:balance">Run your whole service from one screen.</h1>
      <p style="margin:0 0 20px;color:var(--text2);font-size:16px;line-height:1.5">Listen to the sermon, find the verse and put it on screen. Start free with 2 hours of cloud listening. No card needed.</p>
      <button type="button" class="pri" style="height:52px;border:0;border-radius:12px;background:var(--accent);color:var(--ink);font-weight:700;font-size:16px">Create a free account</button>
      <button type="button" class="hv" style="height:52px;border:1px solid var(--line2);border-radius:12px;background:transparent;color:var(--text);font-weight:600;font-size:16px">Log in</button>
      <button type="button" class="hv" style="height:44px;border:0;border-radius:10px;background:transparent;color:var(--text2);font-weight:600;font-size:15px">Continue without an account</button>
      <p style="margin:12px 0 0;color:var(--muted);font-size:13px;text-align:center">Your songs and slides stay on this computer. Offline listening always works.</p>
    </div>
  </div>
</div>


</body>
</html>
